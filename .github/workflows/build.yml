name: Build deb

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install ldid dpkg make xz
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDKs
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS*.sdk "$HOME/theos/sdks/"

      - name: Build (rootless)
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - uses: actions/upload-artifact@v4
        with:
          name: TintIcons-deb
          path: packages/*.deb

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
