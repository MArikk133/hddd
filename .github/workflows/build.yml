name: Build deb

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Find project
        run: |
          echo "=== Files in repo ==="
          find . -not -path './.git/*' -type f | head -50
          CTRL=$(find . -not -path './.git/*' -name control | head -1)
          if [ -z "$CTRL" ]; then
            echo "::error::Файл control не найден. Проект загружен не полностью (нет Makefile/control)."
            exit 1
          fi
          DIR=$(dirname "$CTRL")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Build (rootless)
        working-directory: ${{ env.PROJECT_DIR }}
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - uses: actions/upload-artifact@v4
        with:
          name: TintIcons-deb
          path: ${{ env.PROJECT_DIR }}/packages/*.deb

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/packages/*.deb
